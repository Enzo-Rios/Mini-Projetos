<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de números </title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <h1>Cadastro de Números Inteligente</h1>
    </header>

    <section>
        <div id="cad">
            <p>Digite um Número: 
                <input type="number" name="numero" id="txtnum">
                <input type="button" value="Adicionar" onclick="adicionar()">
            </p>
        </div>

        <div id="txtlista">
            Digite numeros acima para obter sua lista!
        </div>

        <div id="fim">
            <p><input type="button" value="Finalizar" onclick="finalizar()"></p>
        </div>

        <div id="res">
            Assim que tivermos a lista, aparecerá o resultado!!!
        </div>
           
    </section>

    <footer>
        <p>&copy;CtrlNzo</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
