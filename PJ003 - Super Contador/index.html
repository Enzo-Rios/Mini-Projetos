<!DOCTYPE html>
<html lang="pt-br">

    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Vamos contar</h1>
    </header>

    <section>
        <div>
            <p>Inicio:
                <input type="number" name="txtini" id="txtini">

            <p>Fim:

            <input type="button" value="Contar" onclick="contar()">

        <div id="res">
            Preencha os dados acima para obter um resultado!
        </div>
    </section>
